<main class="container">
        <section class="search-box">
            <h1>Explorar por Enredo</h1>
            <p>Busque por temas, objetos ou situações (Ex: <i>Time travel, Wedding, Shark, Paris</i>) e traremos em quais sinopse de filmes ou séries essa palavra aparece.</p>

            <div class="search-area">
                <div style="display: flex; justify-content: center; gap: 25px; flex-wrap: wrap;">
                    <input type="text" id="input-sinopse" placeholder="O que você quer assistir hoje?">
                    <button onclick="executarBuscaSinopse()">Pesquisar</button>
                </div>
            </div>
        </section>

        <div id="resultados-sinopse" class="movie-grid"></div>

    <div id="modal-sinopse" class="modal">
        <div class="modal-content">
